[project]
name = "arcade-deepagent"
version = "0.1.0"
description = "Arcade-powered automation agent quickstart built on deepagents"
requires-python = ">=3.11"
dependencies = [
    "arcadepy>=1.10.0",
    "deepagents>=0.2.6",
    "langchain-openai>=1.1.0",
    "langgraph-cli[inmem]>=0.1.55",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=14.0.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arcade_agent"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "D",
    "D401",
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

